<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#0b0b0c"/>
  <g>
  <!-- Flow around the bag: one arrow on the left arcing up over the bag's
       shoulder to point right, one on the right arcing down to point left.
       Together they wrap the bag; the heads stay horizontal. -->
  <path d="M13 47 A 22 22 0 0 1 27 10.5" stroke="#16a34a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M22 5.5 L28 10.5 L22 15.5" stroke="#16a34a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M51 17 A 22 22 0 0 1 37 53.5" stroke="#16a34a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M42 48.5 L36 53.5 L42 58.5" stroke="#16a34a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Money bag: body, tuft, tie, dollar sign. Drawn slightly smaller than the
       arcs allow so the arrowheads never touch it. -->
  <g transform="translate(32 36) scale(0.86) translate(-32 -36)">
  <path d="M32 25 C 23 25, 18 32.5, 18 39.5 C 18 46, 24.5 48.5, 32 48.5 C 39.5 48.5, 46 46, 46 39.5 C 46 32.5, 41 25, 32 25 Z" fill="#16a34a"/>
  <path d="M27.5 25 L 36.5 25 L 38.5 20.5 L 35 21.7 L 32 18.5 L 29 21.7 L 25.5 20.5 Z" fill="#16a34a"/>
  <rect x="26.7" y="23.8" width="10.6" height="2.6" rx="1.3" fill="#0b0b0c"/>
  <text x="32" y="43" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="15.5" fill="#0b0b0c">$</text>
  </g>

  </g>
</svg>
